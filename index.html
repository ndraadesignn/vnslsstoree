  .bg .shade {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(3,12,31,.30) 0%, rgba(3,12,31,0) 28%, rgba(3,12,31,0) 65%, rgba(3,12,31,.45) 100%);
  }

  /* ---------- Layout ---------- */
  .page {
    position: relative; z-index: 1;
    width: 100%; max-width: 480px;
    min-height: 100vh; min-height: 100dvh;
    margin: 0 auto;
    padding: 56px 20px 28px;
    display: flex; flex-direction: column; align-items: center;
    text-align: center;
  }

  .avatar {
    width: 104px; height: 104px; border-radius: 50%;
    padding: 3px;
    background: linear-gradient(140deg, rgba(120,225,255,.95), rgba(30,120,255,.6));
    box-shadow: 0 0 34px rgba(51,209,255,.55), 0 10px 30px rgba(0,0,0,.45);
  }
  .avatar img {
    display: block; width: 100%; height: 100%;
    border-radius: 50%; object-fit: cover;
    background: #0a2a66;
  }

  h1 {
    margin: 22px 0 0;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    font-size: clamp(2rem, 9vw, 2.6rem);
    font-weight: 600; letter-spacing: -.01em; line-height: 1.1;
    text-shadow: 0 2px 18px rgba(0,0,0,.55);
  }
  .badge { width: .78em; height: .78em; flex: none; filter: drop-shadow(0 2px 6px rgba(0,0,0,.4)); }

  .desc {
    margin: 12px 0 0;
    font-size: clamp(1.02rem, 4.4vw, 1.2rem);
    font-weight: 400; color: var(--ink-soft);
    text-shadow: 0 2px 14px rgba(0,0,0,.6);
  }

  /* ---------- Button ---------- */
  .links { width: 100%; margin-top: 40px; }
  .btn {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    width: 100%; min-height: 76px;
    padding: 6px 56px 6px 84px;
    border-radius: 999px;
    color: var(--ink); text-decoration: none;
    font-size: 1.05rem; font-weight: 500;
    background: linear-gradient(135deg, var(--glass-a), var(--glass-b));
    border: 1px solid var(--glass-line);
    -webkit-backdrop-filter: blur(14px) saturate(120%);
    backdrop-filter: blur(14px) saturate(120%);
    box-shadow: 0 12px 34px rgba(0,10,40,.45), inset 0 1px 0 rgba(255,255,255,.35);
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 16px 40px rgba(0,10,40,.55), 0 0 0 1px rgba(120,225,255,.5), inset 0 1px 0 rgba(255,255,255,.4); }
  .btn:active { transform: scale(.985); }
  .btn:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }

  .btn .thumb {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    width: 58px; height: 58px; border-radius: 50%; object-fit: cover;
    border: 2px solid rgba(255,255,255,.55);
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
  }
  .btn .dots {
    position: absolute; right: 22px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 3.5px; opacity: .85;
  }
  .btn .dots i { display: block; width: 4px; height: 4px; border-radius: 50%; background: #fff; }

  /* ---------- Footer ---------- */
  footer {
    margin-top: auto; padding-top: 48px;
    font-size: .85rem; color: rgba(255,255,255,.78);
    text-shadow: 0 1px 10px rgba(0,0,0,.6);
  }

  @media (prefers-reduced-motion: reduce) {
    .btn { transition: none; }
  }
</style>
</head>
<body>
